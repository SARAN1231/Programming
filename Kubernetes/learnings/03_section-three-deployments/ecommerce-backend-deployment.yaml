apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-backend
  namespace: ecommerce
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: ecommerce-backend-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 50%
      maxSurge: 1 # Ex : If we are updating to next version. in this case it will create 3 new replicas old ones will be gradually decreasing (At a time it can have 4(3 replicas + 1 maxsurge) pods running during update)
  template:
    metadata:
      labels:                         # Labels used for identification, Service matching, selectors, etc.
        app.kubernetes.io/name: ecommerce-backend   # Standard app name label
        app.kubernetes.io/component: backend        # Component type (frontend/backend/db)
        app.kubernetes.io/instance: ecommerce-backend-app   # Unique instance label for grouping app resources
    spec:
      containers:                     # List of containers inside this Pod (usually 1 container per Pod)
      - name: ecommerce-backend      # Name of the container
        image: saran3112/spring-backend:latest   # Docker image stored on Docker Hub
        resources:                    # CPU and memory resource limits & requests
          requests:
            memory: "512Mi"           # Minimum memory required for the container
            cpu: "200m"               # Minimum CPU required (200m = 0.2 CPU core)
          limits:
            memory: "1Gi"           # Maximum memory container can use
            cpu: "500m"               # Maximum CPU container can use (500m = 0.5 CPU core)
        ports:
          - containerPort: 8080      # Port inside the container that the app is running on (Nginx serves on 80)